[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "i386-kalneon_os.json"
target-dir = "../build/kernel"

[target.i686-unknown-none]
rustflags = [
  "-C", "link-args=-nostartfiles -Wl,-entry=_start"
]

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
