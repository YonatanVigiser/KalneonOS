[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[build]
target-dir = "../build/kernel"

[target.i386-unknown-none]
rustflags = ["-C", "link-args=-nostartfiles -Wl –eh-frame-hdr,-entry=_start"]

[target.x86_64-unknown-none]
rustflags = ["-C", "link-args=-nostartfiles -Wl –eh-frame-hdr,-entry=_start"]

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
