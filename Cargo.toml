[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
spin = "0.10"
linked_list_allocator = "0.10"
x86_64 = "0.15"
lazy_static = { version="1.5", features=["spin_no_std"] }
log = "0.4"
multiboot2 = "0.24"

[dependencies.bitvec]
version = "1"
default-features = false
features = ["atomic", "alloc"]

[build-dependencies]
multiboot2-header = "0.7"
